
name: Build stages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            make \
            python3 \
            python3-pip \
            git \
            curl \
            wget \
            openssl \
            libplist-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install ldid
        uses: MOZGIII/install-ldid-action@v1
        with:
          tag: v2.1.5-procursus7

      - name: Prepare scripts
        run: |
          chmod +x build.py
          chmod +x PayloadMaker.py

      - name: Build
        run: python3 build.py

      - name: Verify output
        run: |
          ls -lah
          test -f stages.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stages-build
          path: |
            stages.js
            stages
          if-no-files-found: error
