
name: Build stages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            make \
            python3 \
            python3-pip \
            git \
            curl \
            wget \
            openssl \
            libplist-dev

      - name: Install ldid
        run: |
          wget -q https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux-x86_64 -O ldid || true
          if ! file ldid | grep -q ELF; then
            echo "Could not download ldid binary"
            exit 1
          fi
          chmod +x ldid
          sudo mv ldid /usr/local/bin/ldid
          ldid -h || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare scripts
        run: |
          chmod +x build.py
          chmod +x PayloadMaker.py

      - name: Build
        run: python3 build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stages-build
          path: |
            stages
            stages.js
          if-no-files-found: error
